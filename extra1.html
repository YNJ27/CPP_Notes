<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF Grid</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 900px;
            margin: auto;
        }
        .grid-container img {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <img src="../stochastic_animation_contour_plot.gif" alt="Contour Animation">
        <img src="../animation8.gif" alt="Animation 8">
        <img src="../stochastic_animation_line_plot.gif" alt="Line Plot Animation">
        <img src="../animation4.gif" alt="Animation 4">
    </div>
</body>
</html>
